# panel.tinyaii.cn → 管理面板（nginx 反代）
#
# 🩸🩸 **80 端口只做两件事：ACME 验证 + 301 跳 https**（2026-10-17 改）
#
# 原来这份配置只有 80、没有跳转，靠手工跑 `certbot --redirect` 来补。
# 那有个真风险：**换机器 / 重装 / 迁移时漏跑那一步** ⇒
# `http://panel.tinyaii.cn/admin/` 会**明文提供登录页**，
# 管理员密码就明文上网了 ✗（cookie 的 Secure 只保证"明文下不保存"，
# **挡不住密码在明文通道上被抄走** ✗）
# ⇒ 现在把 443 和跳转**写进这份受版本控制的配置**，不再依赖"记得跑某条命令" ✓
#
# 用法（在服务器上，root）：
#
#   1) 把这份文件放到 /etc/nginx/sites-available/panel.conf
#   2) ln -s /etc/nginx/sites-available/panel.conf /etc/nginx/sites-enabled/
#
#   3) **第一次部署**要分两步（因为"nginx 要证书才能起、证书要 nginx 才能拿"）：
#        a. 先把下面 `# === 443 ===` 那一段整块加上注释 → nginx -t && systemctl reload nginx
#           （这时 80 已经在跑，acme 验证路径通了）
#        b. 拿证书（**webroot 模式，只写证书文件、不碰这份配置** ✓）：
#             certbot certonly --webroot -w /var/www/html -d panel.tinyaii.cn
#           它会自带自动续期 ✓
#        c. 把 443 那段的注释去掉 → nginx -t && systemctl reload nginx ✓
#
#   4) 以后换机器就只跑 1) 2)，然后照 3a~3c 走一遍 ✓
#
# 📌 用 `certonly --webroot` 而不是 `--nginx`：
#    --nginx 模式会**自己改配置**，那这份文件就不再是唯一真相了 ✗
#    webroot 只往 /var/www/html 写一个验证文件，其余一概不碰 ✓
#
# ⚠️ 这是**新增一个文件 + 一个 server_name**，不碰那台机器上任何已有的 server block ✓
#
# 🩸🩸 **不要拿这份文件直接覆盖线上那份**（2026-10-17 实测发现）：
#   线上 /etc/nginx/sites-enabled/panel.conf 是当初 `certbot --nginx` **改过的**版
#   （里面 listen 443 / ssl_certificate 那几行带 `# managed by Certbot` 标记）。
#   certbot 的 nginx 插件**靠这些标记**做以后的自动续期 ⇒
#   覆盖掉它们，续期时它要么报错、要么又把配置改回去 ✗
#
#   📌 这份文件的正确定位是「**换机器 / 从零部署时的模板**」✓
#      换机器时按上面第 3 步用 `certonly --webroot`（不碰配置 ✓）
#      而**已经跑起来的这台**：保持现状就行，别动它 ✓
#
#   ⇒ 也就是说：**M1 这条修的是"以后"**，不是"现在" ——
#     线上现在已经是 https（有 443、有证书），要防的是"哪天迁移时忘了一步，退回明文"✓
# （同一台机器上还跑着别的项目，别去改它们的配置）

# === 80：只负责 ACME 验证，其余全部跳 https ===
server {
    listen 80;
    listen [::]:80;
    server_name panel.tinyaii.cn;

    # certbot 走这个路径验域名归属（--webroot 模式要用）✓
    # ⚠️ 这个 location 必须留在 80 上 —— 证书续期时还没有有效证书呢 ✗
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余一律跳 https ✓（301 是"永久"，浏览器会记住 ⇒ 下次直接走 https 更省一跳）
    location / {
        return 301 https://$host$request_uri;
    }
}

# === 443：真正的服务 ===
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.tinyaii.cn;

    # 证书是 certbot 放的（见上面第 3 步）✓
    ssl_certificate     /etc/letsencrypt/live/panel.tinyaii.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.tinyaii.cn/privkey.pem;

    # 现代 TLS 基线：只留 TLS1.2/1.3，套件交给 nginx 的默认（够新）✓
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # 🩸🩸 下面这几行**一个都不能少** —— 面板靠它们才知道"来访的是谁、走的什么协议"：
        #
        #   X-Real-IP           ⇒ 限流按**真实 IP** 算。
        #                         不设的话面板看到的全是 127.0.0.1 ⇒ 所有人共用一个额度 ⇒
        #                         **一个人就能把所有人锁在门外** ✗
        #                         ⚠️ 用 $remote_addr **覆盖**它：客户端自己塞的同名头会被顶掉 ✓
        #   X-Forwarded-For     ⇒ 兜底（面板取**最后一跳**，前面那些可以伪造）
        #   X-Forwarded-Proto   ⇒ 面板据此决定发不发 HSTS。
        #                         不设的话 HSTS 永远发不出去（面板这头是明文）✗
        #                         📌 443 这段里它是恒定的 "https" ✓
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 面板的接口只收几百字节的 JSON；开大了等于给人一条灌内存的路子
        client_max_body_size 64k;
        proxy_read_timeout   30s;
        proxy_connect_timeout 5s;

        # 不给版本号（省一个指纹，顺手的事）✓
        server_tokens off;
    }
}
