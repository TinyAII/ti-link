# 用 Actions 把仓库内容发到 GitHub Pages。
#
# 📌 为什么不用 Pages 自带的 legacy 构建：开了之后状态一直卡在 building、
# duration = 0（压根没跑），等了半小时还是 404 ✗
# 换成 Actions 就完全在明面上：每次跑完在仓库的 Actions 页看得到日志，
# 成功失败一目了然 ✓
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
